on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0). Only used when running manually; tag pushes use the pushed tag name automatically.'
        required: true

name: Create Release From Tags

jobs:
  build:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        run: |
          gh release create "${{ steps.version.outputs.value }}" \
            --title "${{ steps.version.outputs.value }}" \
            --notes "To see the changes in this version, see the CHANGELOG.md file." \
            --target "${{ github.sha }}"
  publish:
      name: Publish Release on PyPI
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - name: Install dependencies
          run: |
            python3 -m pip install --upgrade pip
            pip install setuptools wheel twine
        - name: Build and publish
          env:
            TWINE_USERNAME: __token__
            TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
            PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          run: |
            python3 setup.py sdist bdist_wheel
            twine upload dist/*
